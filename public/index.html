<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인스타 스튜디오">
<title>인스타 스튜디오</title>
<style>
  /* 셸은 탭 바와 틀만 맡는다. 색은 세 앱 어느 쪽과도 부딪히지 않게 중립으로 둔다. */
  :root{
    --bar:#14131a; --bar-line:#2a2836;
    --ink:#e8e6ef; --ink-dim:#8d8aa0;
    --accent:#8b5cf6; --accent-soft:rgba(139,92,246,.16);
    --page:#ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --page:#0f0e13; color-scheme: dark }
  }
  :root[data-theme="dark"]{ --page:#0f0e13; color-scheme: dark }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── 탭 바 ── */
  .bar{
    flex:none; display:flex; align-items:center; gap:10px;
    background:var(--bar); border-bottom:1px solid var(--bar-line);
    padding:0 12px; padding-top:env(safe-area-inset-top,0px);
    height:calc(52px + env(safe-area-inset-top,0px));
  }
  .brand{
    display:flex; align-items:center; gap:7px; flex:none;
    font-weight:800; font-size:14px; letter-spacing:-.02em; color:var(--ink);
    padding-right:4px;
  }
  .brand .dot{
    width:19px; height:19px; border-radius:6px; flex:none;
    background:linear-gradient(135deg,#7C3AED,#4F46E5);
    display:grid; place-items:center; font-size:11px;
  }
  .brand b{font-weight:800; white-space:nowrap}

  .tabs{display:flex; gap:3px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none; display:flex; align-items:center; gap:6px;
    background:transparent; border:0; cursor:pointer;
    color:var(--ink-dim); font:inherit; font-size:13.5px; font-weight:600;
    padding:7px 13px; border-radius:9px; white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .tab:hover{color:var(--ink); background:rgba(255,255,255,.05)}
  .tab[aria-selected="true"]{color:#fff; background:var(--accent-soft); box-shadow:inset 0 0 0 1px rgba(139,92,246,.4)}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .tab .ico{font-size:14px; line-height:1}

  /* ── 앱 영역 ── */
  .stage{flex:1; position:relative; min-height:0; background:var(--page)}
  .stage iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; display:block; background:var(--page);
  }

  .boot{
    position:absolute; inset:0; display:grid; place-items:center;
    color:var(--ink-dim); font-size:13px; background:var(--page); text-align:center;
  }
  .boot .spin{
    width:26px; height:26px; border-radius:50%;
    border:2.5px solid rgba(139,92,246,.25); border-top-color:var(--accent);
    animation:spin .7s linear infinite; margin:0 auto 10px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .boot .spin{animation:none} }

  @media (max-width:520px){
    .brand b{display:none}
    .tab{padding:7px 10px; font-size:12.5px}
    .bar{gap:6px; padding:0 8px}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span class="dot">✨</span><b>인스타 스튜디오</b></div>
  <nav class="tabs" role="tablist" aria-label="앱 선택">
    <button class="tab" role="tab" id="tab-cardnews" aria-selected="true"  aria-controls="frame-cardnews"><span class="ico">🎨</span>카드뉴스</button>
    <button class="tab" role="tab" id="tab-reels"    aria-selected="false" aria-controls="frame-reels"><span class="ico">🎬</span>릴스 메이커</button>
    <button class="tab" role="tab" id="tab-pipeline" aria-selected="false" aria-controls="frame-pipeline"><span class="ico">⚡</span>파이프라인</button>
  </nav>
</header>

<main class="stage" id="stage">
  <div class="boot" id="boot"><div><div class="spin"></div>불러오는 중…</div></div>
</main>

<script>
(function(){
  var APPS = [
    { id:'cardnews', src:'apps/cardnews.html', title:'카드뉴스' },
    { id:'reels',    src:'apps/reels.html',    title:'릴스 메이커' },
    { id:'pipeline', src:'apps/pipeline.html', title:'파이프라인' }
  ];

  var stage = document.getElementById('stage');
  var boot  = document.getElementById('boot');
  var frames = {};
  var current = null;

  function appById(id){
    for (var i=0;i<APPS.length;i++) if (APPS[i].id === id) return APPS[i];
    return null;
  }

  // 세 개를 한꺼번에 띄우면 첫 화면이 느려진다. 탭을 처음 누를 때 그 앱만 만든다.
  // 한 번 만든 iframe 은 숨기기만 하므로 작업하던 내용이 그대로 남는다.
  function ensureFrame(id){
    if (frames[id]) return frames[id];
    var app = appById(id);
    var f = document.createElement('iframe');
    f.id = 'frame-' + id;
    f.title = app.title;
    f.setAttribute('role','tabpanel');
    f.setAttribute('aria-labelledby','tab-' + id);
    f.allow = 'clipboard-write; microphone; camera';
    f.addEventListener('load', function(){
      f.dataset.loaded = '1';
      if (current === id) boot.hidden = true;
    });
    f.src = app.src;
    stage.appendChild(f);
    frames[id] = f;
    return f;
  }

  function select(id, push){
    if (!appById(id)) id = APPS[0].id;
    if (id === current) return;

    var f = ensureFrame(id);
    for (var k in frames) frames[k].style.visibility = (k === id) ? 'visible' : 'hidden';
    boot.hidden = f.dataset.loaded === '1';

    for (var i=0;i<APPS.length;i++){
      document.getElementById('tab-' + APPS[i].id)
              .setAttribute('aria-selected', String(APPS[i].id === id));
    }

    current = id;
    document.title = appById(id).title + ' · 인스타 스튜디오';
    try { localStorage.setItem('studio_tab', id); } catch(e){}
    if (push && location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  }

  for (var i=0;i<APPS.length;i++){
    (function(a){
      document.getElementById('tab-' + a.id)
              .addEventListener('click', function(){ select(a.id, true); });
    })(APPS[i]);
  }

  // 좌우 화살표로 탭 이동
  document.querySelector('.tabs').addEventListener('keydown', function(e){
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var idx = 0;
    for (var i=0;i<APPS.length;i++) if (APPS[i].id === current) idx = i;
    var next = APPS[(idx + (e.key === 'ArrowRight' ? 1 : APPS.length - 1)) % APPS.length];
    select(next.id, true);
    document.getElementById('tab-' + next.id).focus();
    e.preventDefault();
  });

  window.addEventListener('hashchange', function(){ select(location.hash.slice(1), false); });

  // 주소의 #탭 → 지난번에 보던 탭 → 카드뉴스 순으로 고른다.
  var saved = null;
  try { saved = localStorage.getItem('studio_tab'); } catch(e){}
  select(location.hash.slice(1) || saved || 'cardnews', true);

  // PWA 서비스워커. 최상위 문서에서만 등록된다 — 각 앱은 iframe 안이라
  // 거기서 등록하면 "unknown error when fetching the script" 로 실패한다.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
